# 发布流水线：仅当推送 v* 标签时触发（分支 push / PR 不构建）。
# 产物：dist/up-video-strm-<版本>-win-x64-setup.exe，自动附加到对应的 GitHub Release。
# 发布前须先 bump 版本并提交（packaging/bump_version.py），再打匹配的 v<版本> 标签。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Verify tag matches version
        shell: pwsh
        run: |
          $version = [regex]::Match(
            (Get-Content backend/app/version.py -Raw),
            '__version__\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} 与 backend/app/version.py ($version) 不一致：请先运行 packaging/bump_version.py 并提交，再打匹配的标签"
          }
          Write-Host "版本一致：v$version"

      - name: Build installer
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & packaging/build.ps1 -Python $python

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: up-video-strm-setup
          path: dist/up-video-strm-*-win-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/up-video-strm-*-win-x64-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
